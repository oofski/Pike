<?xml version="1.0" encoding="UTF-8"?>
<!--
  PIKE Rush app icon — Pi Kappa Alpha, Sigma Chapter (Vanderbilt).
  Garnet circle background with gold "ΠΚΑ" lettering.

  NOTE: No raster tooling (rsvg-convert / ImageMagick / sharp) was available in
  the build environment, so only this SVG was generated. It is intentionally
  NOT referenced as build/icon.png in electron-builder.yml — electron-builder
  falls back to the default Electron icon, so the build cannot fail on a missing
  icon. To enable this custom icon, render it to build/icon.png at 1024x1024
  (e.g. `rsvg-convert -w 1024 -h 1024 build/icon.svg -o build/icon.png`).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="garnet" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#9B1B22"/>
      <stop offset="70%" stop-color="#7B1419"/>
      <stop offset="100%" stop-color="#5A0E12"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8CC6B"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#A8851A"/>
    </linearGradient>
  </defs>

  <!-- Garnet circle background -->
  <circle cx="512" cy="512" r="496" fill="url(#garnet)"/>
  <!-- Thin gold ring -->
  <circle cx="512" cy="512" r="470" fill="none" stroke="url(#gold)" stroke-width="14"/>

  <!-- Gold Greek lettering: ΠΚΑ -->
  <text x="512" y="512"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Times New Roman', Georgia, 'DejaVu Serif', serif"
        font-weight="700"
        font-size="360"
        letter-spacing="8"
        fill="url(#gold)">ΠΚΑ</text>
</svg>
